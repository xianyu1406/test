name: Android build and checks
on:
  push:
    branches-ignore: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      instrumentation:
        description: 'Run API35 emulator smoke tests (about 5–10 extra minutes; no phone calls)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21.0.9+10'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Unit tests, lint, debug APK and instrumentation APK
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Record artifact identity
        if: success()
        shell: bash
        run: |
          mkdir -p artifacts
          printf 'Commit: %s\nPackage: cn.zhundian.app\nVersion: 0.1.0 (1)\n' "$GITHUB_SHA" > artifacts/BUILD.txt
          sha256sum app/build/outputs/apk/debug/*.apk >> artifacts/BUILD.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk >> artifacts/BUILD.txt
          printf '\nEphemeral debug signing: updates require matching signing certificates.\n' >> artifacts/BUILD.txt
      - name: Upload APKs and build identity
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: zhundian-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            artifacts/BUILD.txt
          retention-days: 14
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-reports-${{ github.sha }}
          path: |
            core/build/reports/
            core/build/test-results/
            app/build/reports/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: warn

  instrumentation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.instrumentation }}
    needs: debug
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21.0.9+10'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Enable KVM for the isolated runner
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Native API35 smoke tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -camera-back none -camera-front none
          script: scripts/run-device-tests.sh
      - name: Upload instrumentation reports and device evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-api35-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            artifacts/device/
          retention-days: 14
          if-no-files-found: warn
